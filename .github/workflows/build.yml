name: Build books

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build template and all books
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          status=0
          for book in template books/*/; do
            book="${book%/}"
            echo "::group::$book"
            if ! (cd "$book" && latexmk); then
              echo "::error::Build failed: $book"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Collect PDFs
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p _pdfs
          for pdf in books/*/build/main.pdf; do
            name=$(basename "$(dirname "$(dirname "$pdf")")")
            cp "$pdf" "_pdfs/$name.pdf"
          done
          if [ -f template/build/main.pdf ]; then
            cp template/build/main.pdf _pdfs/template.pdf
          fi

      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-pdfs
          path: _pdfs/*.pdf
          if-no-files-found: warn
